plugins {
    id 'com.android.application'
}

// Release signing: from android/keystore.properties (never committed) or,
// in CI, from environment variables. Without either, release builds are
// unsigned (fine for Play's upload flow you sign later, not for installing).
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String prop, String env -> keystoreProps.getProperty(prop) ?: System.getenv(env) }
def releaseStoreFile = signingValue('storeFile', 'ANDROID_KEYSTORE_FILE')

android {
    namespace 'com.codrixo.droidmirror'
    compileSdk 36

    defaultConfig {
        applicationId 'com.codrixo.droidmirror'
        minSdk 31 // Android 12: TelephonyCallback; ACTION_IME_ENTER needs 30
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        warningsAsErrors false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
