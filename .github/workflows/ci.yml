name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Fetch pinned scrcpy-server
        run: ./scripts/fetch-server.sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Package (ad-hoc signed)
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DroidMirror-macos
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    name: Shared code (Linux, headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: ./scripts/fetch-server.sh
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DroidMirror-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  versions:
    name: Versions match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-version.sh
