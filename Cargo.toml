[package]
name = "droidmirror"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Lightweight native macOS mirroring and control for Android, using scrcpy-server"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.104"
log = "0.4.35"
thiserror = "2.0.21"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-av-foundation = { version = "0.3.2", features = ["objc2-core-media"] }
objc2-core-media = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-image = "0.3.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
